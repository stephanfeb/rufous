[workspace]
resolver = "3"
members = ["crates/boubou-core", "crates/boubou-voice", "crates/boubou-web", "crates/boubou-cli", "crates/boubou-app"]
# The Tauri shell is heavy to compile; build it explicitly with `cargo build -p boubou-app`.
default-members = ["crates/boubou-core", "crates/boubou-voice", "crates/boubou-web", "crates/boubou-cli"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
license = "Apache-2.0"
repository = "https://github.com/stephanfeb/boubou"
authors = ["Stephan February"]
description = "Boubou: a local-model autonomous agent, the Rust successor to Mingbird"

[workspace.dependencies]
boubou-core = { path = "crates/boubou-core" }
boubou-web = { path = "crates/boubou-web" }
boubou-voice = { path = "crates/boubou-voice" }
axum = { version = "0.8", default-features = false, features = ["http1", "json", "query", "tokio"] }
tokio-stream = { version = "0.1", features = ["sync"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "process", "fs", "io-util", "time", "sync"] }
reqwest = { version = "0.13", default-features = false, features = ["json", "stream", "rustls", "blocking"] }
futures-util = "0.3"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dirs = "6"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
tempfile = "3"
regex = "1"
encoding_rs = "0.8"
sha1 = "0.10"
scraper = { version = "0.23", default-features = false }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
sysinfo = { version = "0.37", default-features = false, features = ["system"] }
rmcp = { version = "3.8", default-features = false, features = ["client", "transport-child-process", "transport-streamable-http-client-reqwest", "reqwest"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
unwrap_used = "warn"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
