[package]
name = "boubou-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Boubou command-line agent"

[[bin]]
name = "boubou"
path = "src/main.rs"

[features]
default = []
# Local speech-to-text in `boubou serve` / `boubou voice` (sherpa-onnx native libs).
voice = ["boubou-general/voice", "boubou-voice/sherpa"]

[dependencies]
boubou-kernel.workspace = true
boubou-general.workspace = true
boubou-voice.workspace = true
boubou-coding.workspace = true
anyhow.workspace = true
clap.workspace = true
serde_json.workspace = true
tokio.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true

[lints]
workspace = true

[dev-dependencies]
tempfile.workspace = true
