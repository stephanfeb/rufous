[package]
name = "boubou-voice"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true
description = "Boubou voice input: WAV handling, local sherpa-onnx streaming STT, Ollama audio-model fallback"

[features]
default = []
# Local speech-to-text through sherpa-onnx (prebuilt static libs are fetched at build time).
# Off by default so the plain build stays free of native dependencies.
sherpa = ["dep:sherpa-onnx"]

[dependencies]
boubou-kernel.workspace = true
serde_json.workspace = true
thiserror.workspace = true
reqwest.workspace = true
sherpa-onnx = { version = "=2.0.1", optional = true }

[dev-dependencies]
tempfile.workspace = true

[lints]
workspace = true
